name: Haftalık teslim
description: Haftanın görevini (Hafta 2 ve 3'te kişisel sayfan, Hafta 4'ten itibaren takım ürünündeki iş) ve yapay zekâ notunu teslim et.
title: "Teslim: "
labels: ["teslim"]
body:
  - type: markdown
    attributes:
      value: |
        Her hafta için ayrı bir teslim gönderirsin; takım işinde de her üye kendi adıyla gönderir. Aynı haftaya ikinci kez gönderirsen yenisi geçerli sayılır. Gönderdikten sonra düzeltmek için sağ üstteki üç noktadan **Edit** de.
  - type: dropdown
    id: hafta
    attributes:
      label: Hafta
      description: Hangi haftanın görevini teslim ediyorsun?
      options:
        - "Hafta 2 · HTML"
        - "Hafta 3 · CSS"
        - "Hafta 4 · Uçtan uca ürün ve mimari"
        - "Hafta 5 · GitHub akışı ve yapay zekâ ajanları"
        - "Hafta 6 · Veri katmanı: web VTYS"
        - "Hafta 7 · API, kimlik ve dil modeli API'leri"
        - "Hafta 8 · Bulut ve yayına alma"
        - "Hafta 9 · Önbellek ve performans"
        - "Hafta 10 · Güvenlik açıklarının analizi"
        - "Hafta 11 · Kod analizi, test ve kalite"
        - "Hafta 12 · Çapraz platform"
        - "Hafta 13 · Pazara çıkış"
    validations:
      required: true
  - type: input
    id: numara
    attributes:
      label: Öğrenci numarası
      placeholder: "230101001"
    validations:
      required: true
  - type: input
    id: ad
    attributes:
      label: Ad soyad
      placeholder: "Ece Yılmaz"
    validations:
      required: true
  - type: input
    id: yayin
    attributes:
      label: Yayındaki sayfanın adresi
      description: Hafta 2 ve 3'te kişisel sayfanın GitHub Pages adresi; Hafta 4'ten itibaren takım ürününün canlı adresi (önizleme adresi de olur).
      placeholder: "https://kullaniciadin.github.io/depo-adi/"
    validations:
      required: true
  - type: input
    id: depo
    attributes:
      label: Deponun adresi
      description: Hafta 4'ten itibaren takım deposunun adresi.
      placeholder: "https://github.com/kullaniciadin/depo-adi"
    validations:
      required: true
  - type: input
    id: bozuk
    attributes:
      label: Düzeltilmiş bozuk paketin adresi
      description: Yalnız Hafta 2 ve 3 için, bozuk paketi düzelttiysen. Hafta 4'ten itibaren boş bırak.
      placeholder: "https://github.com/kullaniciadin/bozuk-paket"
  - type: textarea
    id: yz
    attributes:
      label: Yapay zekâ notu
      description: Bu hafta kendin ne yaptın, yapay zekâ ne yaptı, ürettiği şeyde neyi değiştirmek zorunda kaldın? Üç dört satır yeter.
      placeholder: |
        Veri modelini ben çizdim, tabloları kodlama aracına yazdırdım.
        Ürettiği politikayı test ettim, birini değiştirdim.
        Kullanmadığım yerde bunu da yaz.
    validations:
      required: true
  - type: textarea
    id: takildigi
    attributes:
      label: Takıldığın yer
      description: Zorlandığın ya da çözemediğin bir şey varsa yaz. Yoksa boş bırak.
  - type: input
    id: birlikte
    attributes:
      label: Birlikte çalıştığın kişi
      description: Biriyle birlikte çalıştıysan adını yaz. Yoksa boş bırak.
