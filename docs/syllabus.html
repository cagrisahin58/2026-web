<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YZM205 Ders Planı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#121A2B; --ground:#F5F7FB; --surface:#FFFFFF; --surface-2:#EEF2F8; --line:#D9DEE8; --muted:#5B6577;
  --theory:#2352D9; --theory-soft:#E4EAFB; --lab:#0A6F62; --lab-soft:#DDF3EF; --ship:#8F5600; --ship-soft:#FBEBD2; --ai:#7A3DD6; --ai-soft:#EEE6FB;
  --focus:#2352D9; --shadow:0 1px 2px rgba(18,26,43,.06),0 8px 24px -12px rgba(18,26,43,.18);
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E7ECF5; --ground:#0E131D; --surface:#161C29; --surface-2:#1D2535; --line:#2A3345; --muted:#9AA5B8;
    --theory:#7B97FF; --theory-soft:#1B2545; --lab:#3FC4B0; --lab-soft:#123430; --ship:#F0A93B; --ship-soft:#3A2A10; --ai:#B48CFF; --ai-soft:#2C1F4A;
    --focus:#7B97FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#E7ECF5; --ground:#0E131D; --surface:#161C29; --surface-2:#1D2535; --line:#2A3345; --muted:#9AA5B8;
  --theory:#7B97FF; --theory-soft:#1B2545; --lab:#3FC4B0; --lab-soft:#123430; --ship:#F0A93B; --ship-soft:#3A2A10; --ai:#B48CFF; --ai-soft:#2C1F4A;
  --focus:#7B97FF; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--theory);text-decoration-thickness:1px;text-underline-offset:2px}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(1.9rem,5vw,3rem);font-weight:800}
h2{font-size:clamp(1.35rem,2.6vw,1.75rem);font-weight:700}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
p+p{margin-top:10px}
ul,ol{margin:0;padding-left:1.2em}
li{margin:.25em 0}
code{font-family:var(--mono);font-size:.9em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:clamp(16px,4vw,32px)}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}
.lede{max-width:68ch;font-size:1.03rem}
.muted{color:var(--muted)}

/* Üst çubuk ve bölüm menüsü */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px 16px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.02rem;white-space:nowrap;display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--theory);box-shadow:0 0 0 4px var(--theory-soft)}
nav.jump{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1 1 320px;min-width:0}
nav.jump::-webkit-scrollbar{display:none}
nav.jump a{color:var(--muted);text-decoration:none;font:500 .86rem/1 var(--body);padding:9px 10px;border-radius:999px;white-space:nowrap}
nav.jump a:hover{color:var(--ink);background:var(--surface-2)}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 .86rem/1 var(--body);padding:9px 14px;border-radius:10px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.primary:hover{opacity:.92;background:var(--ink)}
.btn.small{padding:7px 10px;font-size:.8rem}

main{padding-block:28px 64px}
main>section{scroll-margin-top:120px}
main>section+section{margin-top:52px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}

/* Açılış */
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:end}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.72rem;font-weight:500;padding:4px 9px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%;overflow-wrap:anywhere}
.chip.theory{background:var(--theory-soft);border-color:transparent;color:var(--theory)}
.chip.lab{background:var(--lab-soft);border-color:transparent;color:var(--lab)}
.chip.ship{background:var(--ship-soft);border-color:transparent;color:var(--ship)}
.chip.ai{background:var(--ai-soft);border-color:transparent;color:var(--ai)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.now .row{display:flex;align-items:center;gap:14px;margin-top:8px}
.now .big{font-family:var(--display);font-size:2.6rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.now .btn{margin-top:14px}
.updated{margin-top:14px;font-size:.88rem}

/* Amaç ve ritim */
.cards2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{margin-bottom:8px}
.block .when{font-family:var(--mono);font-size:.74rem;letter-spacing:.06em;margin-bottom:6px}
.block.theory{border-top:3px solid var(--theory)} .block.theory .when{color:var(--theory)}
.block.lab{border-top:3px solid var(--lab)} .block.lab .when{color:var(--lab)}
.steps{list-style:none;padding:0;display:grid;gap:8px;margin-top:10px}
.steps li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;align-items:start;margin:0}
.steps .k{font-family:var(--mono);font-size:.72rem;font-weight:500;padding:3px 0;text-align:center;border-radius:6px;background:var(--lab-soft);color:var(--lab)}
.callout{border-left:3px solid var(--theory);background:var(--surface);border-radius:0 10px 10px 0;padding:12px 16px;font-size:.94rem;margin-top:14px}
.callout.ship{border-left-color:var(--ship)}
.callout.ai{border-left-color:var(--ai)}

/* Haftalar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar .spacer{flex:1}
.timeline{display:grid;gap:10px}
details.week{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;scroll-margin-top:120px}
details.week[open]{box-shadow:var(--shadow)}
details.week.next{border-color:var(--theory);box-shadow:0 0 0 3px var(--theory-soft)}
details.week.off{background:var(--surface-2)}
details.week summary{list-style:none;display:grid;grid-template-columns:74px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
details.week summary::-webkit-details-marker{display:none}
.num{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.num small{display:block;font-family:var(--mono);font-size:.64rem;font-weight:500;color:var(--muted);letter-spacing:.04em;margin-top:4px;white-space:nowrap}
.wtitle{font-family:var(--display);font-weight:700;font-size:1.06rem}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tags .chip{font-size:.66rem;padding:2px 7px}
.flags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.caret{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);transition:transform .2s;font-size:.8rem}
details.week[open] .caret{transform:rotate(180deg)}
.week-body{border-top:1px solid var(--line);padding:16px 16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.col h4{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:500;margin:0 0 6px;display:flex;align-items:center;gap:8px}
.col h4::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--line)}
.col.theory h4{color:var(--theory)} .col.theory h4::before{background:var(--theory)}
.col.lab h4{color:var(--lab)} .col.lab h4::before{background:var(--lab)}
.col p{font-size:.94rem}
.ms{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;background:var(--ship-soft);border-radius:10px;padding:10px 14px;font-size:.93rem}
.ms .flag{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.08em;color:var(--ship);white-space:nowrap;margin-top:2px}
.links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 16px;font-size:.93rem}
.period{display:grid;grid-template-columns:74px minmax(0,1fr);gap:14px;align-items:start;background:var(--theory-soft);border:1px dashed var(--theory);border-radius:14px;padding:14px 16px;scroll-margin-top:120px}
.period.next{box-shadow:0 0 0 3px var(--theory-soft);border-style:solid}
.period .pl{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;color:var(--theory);font-weight:500;line-height:1.35}
.period .pt{font-family:var(--display);font-weight:700;font-size:1.02rem}
.period .px{font-size:.92rem;margin-top:2px}

/* Proje */
.track{display:grid;grid-template-columns:repeat(15,minmax(0,1fr));gap:4px;margin:16px 0 6px}
.track .cell{height:34px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:.66rem;color:var(--muted);text-align:center;line-height:1.1;min-width:0}
.track .cell.m{background:var(--ship-soft);border-color:var(--ship);color:var(--ship);font-weight:500}
.track .cell.exam{background:var(--theory-soft);border-color:var(--theory);color:var(--theory)}
.track .cell.off{opacity:.55}
.mslist{display:grid;gap:10px;margin-top:14px}
.msrow{display:grid;grid-template-columns:70px minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.msrow .code{font-family:var(--display);font-weight:800;font-size:1.35rem;line-height:1.1;color:var(--ship)}
.msrow .code small{display:block;font-family:var(--mono);font-weight:500;font-size:.64rem;letter-spacing:.04em;color:var(--muted);white-space:nowrap;margin-top:3px}
.msrow .when{font-weight:600}

/* Tablolar */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
.tablewrap table{min-width:560px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
th{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--muted)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.b{font-weight:600}

/* Not çubuğu */
.bar{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin:14px 0 10px}
.bar div{display:grid;place-items:center;font-family:var(--mono);font-size:.74rem;font-weight:500;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.bar .gap{flex:0 0 4px;background:var(--ground)}
.barlegend{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:.74rem;color:var(--muted);flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;margin-top:14px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:.93rem}
.fact .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}

/* Teslim ve kontrol listesi */
.check{list-style:none;padding:0;display:grid;gap:6px}
.check li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;font-size:.94rem;margin:0}
.check li::before{content:"";width:14px;height:14px;margin-top:4px;border-radius:4px;border:1.5px solid var(--lab);background:var(--lab-soft)}
.due{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:2px 0 6px}

/* Yapay zekâ notu */
.notebar{display:flex;justify-content:flex-end;margin-top:10px}
.note{margin:6px 0 0;white-space:pre-wrap;font-family:var(--mono);font-size:.86rem;line-height:1.7;background:var(--surface-2);padding:14px 16px;border-radius:10px;overflow-x:auto}
.copied{font-size:.82rem;color:var(--lab);margin-top:6px;min-height:1.2em}

footer{border-top:1px solid var(--line);padding-block:24px 40px;color:var(--muted);font-size:.86rem}

@media (max-width:760px){
  .hero,.cards2,.week-body{grid-template-columns:minmax(0,1fr)}
  details.week summary{grid-template-columns:58px minmax(0,1fr);gap:10px}
  .flags{grid-column:1/-1;justify-content:flex-start}
  .caret{display:none}
  .period{grid-template-columns:minmax(0,1fr)}
  .track{grid-template-columns:repeat(8,minmax(0,1fr))}
  .num{font-size:1.6rem}
  #themeBtn{margin-left:auto}
  .top{position:relative}
  nav.jump{order:3;flex-basis:100%;flex-wrap:wrap;overflow:visible}
  nav.jump a{padding:8px 9px}
  .top .wrap{row-gap:4px}
  main>section,details.week,.period{scroll-margin-top:16px}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
@media print{
  .top,.toolbar,.btn{display:none!important}
  details.week{break-inside:avoid}
  body{background:#fff;color:#000}
}
</style>
<style>.kilitli{opacity:.6;cursor:not-allowed;text-decoration:none}a.kilitli,span.kilitli.btn{pointer-events:none}</style>

<script>
(function(){
  var root = document.documentElement;

  // ---- tema: açık / koyu, tercih bu tarayıcıda hatırlanır ----
  try{ var saved = localStorage.getItem('yzm205.theme'); if(saved==='light'||saved==='dark') root.setAttribute('data-theme', saved); }catch(e){}
  var themeBtn = document.getElementById('themeBtn');
  function effectiveTheme(){
    var a = root.getAttribute('data-theme'); if(a) return a;
    return (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function syncThemeBtn(){ themeBtn.textContent = effectiveTheme()==='dark' ? 'Açık tema' : 'Koyu tema'; }
  themeBtn.addEventListener('click', function(){
    var next = effectiveTheme()==='dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try{ localStorage.setItem('yzm205.theme', next); }catch(e){}
    syncThemeBtn();
  });
  syncThemeBtn();

  var D = window.SYLLABUS;
  var main = document.getElementById('main');
  if(!D){ main.textContent = 'İçerik yüklenemedi.'; return; }

  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
  var md = function(s){ return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>'); };
  var chips = function(arr){ return (arr||[]).map(function(c){ return '<span class="chip '+esc(c.kind||'')+'">'+esc(c.text||c)+'</span>'; }).join(''); };

  // ---- tarih yardımcıları ----
  var AY = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var day = function(s){ var p = s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
  var human = function(s){ var d = day(s); return d.getDate()+' '+AY[d.getMonth()]; };
  var today = new Date(); today.setHours(0,0,0,0);

  // Sıradaki ders: bitiş tarihi bugünden önce olmayan ilk hafta ya da dönem
  var items = D.weeks.map(function(w){ return {type:'week', ref:w, start:day(w.date), end:day(w.date)}; })
    .concat(D.periods.map(function(p){ return {type:'period', ref:p, start:day(p.start), end:day(p.end)}; }))
    .sort(function(a,b){ return a.start-b.start; });
  var next = null;
  for(var i=0;i<items.length;i++){ if(items[i].end >= today){ next = items[i]; break; } }
  var nextWeek = next && next.type==='week' ? next.ref.n : null;
  var nextPeriod = next && next.type==='period' ? next.ref.id : null;

  var SECTIONS = [
    {id:'amac', label:'Amaç'},{id:'ritim', label:'Haftalık ritim'},{id:'plan', label:'14 hafta'},
    {id:'proje', label:'Proje'},{id:'degerlendirme', label:'Değerlendirme'},{id:'teslim', label:'Lab teslimi'},
    {id:'yapay-zeka', label:'Yapay zekâ'},{id:'araclar', label:'Araçlar'}
  ];

  // ---- açılış ----
  function hero(){
    var c = D.course, box;
    if(next && next.type==='week'){
      var w = next.ref, isToday = +next.start===+today;
      box = '<div class="eyebrow">'+(isToday?'Bugün':'Sıradaki ders')+' · '+esc(human(w.date))+' Perşembe</div>'+
        '<div class="row"><div class="big">'+w.n+'</div><div><div style="font-weight:600">'+esc(w.title)+'</div>'+
        '<div class="muted" style="font-size:.9rem">'+(w.off?'Ders yok':'10:00 teori · 15:00 lab · BLD-104')+'</div></div></div>'+
        '<button class="btn primary" type="button" data-goto="'+w.n+'">Haftayı aç</button>';
    } else if(next){
      var p = next.ref;
      box = '<div class="eyebrow">'+esc(p.label)+' · '+esc(p.dates)+'</div><div class="row"><div><div style="font-weight:600">'+esc(p.title)+'</div>'+
        '<div class="muted" style="font-size:.9rem">'+md(p.text)+'</div></div></div>'+
        '<button class="btn primary" type="button" data-goto-period="'+esc(p.id)+'">Takvimde göster</button>';
    } else {
      box = '<div class="eyebrow">Dönem</div><div class="row"><div><div style="font-weight:600">Dönem tamamlandı</div>'+
        '<div class="muted" style="font-size:.9rem">Projelerin yayında kalsın, portföyünde dursun.</div></div></div>';
    }
    return '<section class="hero" id="basla">'+
      '<div><div class="eyebrow">'+esc(c.institution)+' · '+esc(c.term)+'</div>'+
      '<h1 style="margin-top:10px">'+esc(c.title)+'</h1>'+
      '<p class="lede" style="margin-top:10px">'+esc(c.subtitle)+'</p>'+
      '<div class="meta">'+chips(c.meta)+'</div>'+
      '<p class="updated muted">'+esc(c.updated)+'</p></div>'+
      '<aside class="now" aria-label="Sıradaki ders">'+box+'</aside></section>';
  }

  function purpose(){
    return '<section id="amac"><div class="section-head"><h2>Dersin amacı</h2></div>'+
      D.purpose.map(function(p){ return '<p class="lede">'+md(p)+'</p>'; }).join('')+'</section>';
  }

  function rhythm(){
    var R = D.rhythm;
    return '<section id="ritim"><div class="section-head"><h2>Haftalık ritim</h2><span class="muted">Her Perşembe iki blok</span></div>'+
      '<div class="cards2">'+
        '<div class="card block theory"><div class="when">'+esc(R.theory.when)+'</div><h3>'+esc(R.theory.title)+'</h3><p>'+md(R.theory.text)+'</p></div>'+
        '<div class="card block lab"><div class="when">'+esc(R.lab.when)+'</div><h3>'+esc(R.lab.title)+'</h3><p>'+md(R.lab.text)+'</p>'+
          '<ol class="steps">'+R.steps.map(function(s){ return '<li><span class="k">'+esc(s.k)+'</span><span>'+md(s.text)+'</span></li>'; }).join('')+'</ol></div>'+
      '</div><div class="callout">'+md(R.notes)+'</div></section>';
  }

  function weekRow(w){
    var isNext = w.n===nextWeek, flags = '';
    if(isNext) flags += '<span class="chip theory">Sıradaki</span>';
    if(w.off) flags += '<span class="chip">'+esc(w.flag||'Tatil')+'</span>';
    if(w.graded) flags += '<span class="chip lab">Lab puanlı</span>';
    if(w.project && /^M\d$/.test(w.project.code)) flags += '<span class="chip ship">'+esc(w.project.code)+'</span>';
    var body = '<div class="col theory"><h4>'+(w.n===1?'Sabah':(w.off||w.n===14?'Bu hafta':'Bu hafta öğreneceklerin'))+'</h4><p>'+md(w.learn)+'</p></div>';
    if(w.lab) body += '<div class="col lab"><h4>'+(w.n===1?'Öğleden sonra':'Lab · Yap · Boz · Anlat')+'</h4><p>'+md(w.lab)+'</p></div>';
    if(w.project){
      var flag = /^M\d$/.test(w.project.code) ? 'PROJE · '+w.project.code : 'PROJE';
      body += '<div class="ms"><span class="flag">'+esc(flag)+'</span><span>'+md(w.project.text)+'</span></div>';
    }
    if(w.links) body += '<div class="links">'+w.links.map(function(l){ return '<a href="'+esc(l.href)+'">'+esc(l.label)+'</a>'; }).join('')+'</div>';
    return '<details class="week'+(isNext?' next':'')+(w.off?' off':'')+'" id="hafta-'+w.n+'">'+
      '<summary><div class="num">'+String(w.n).padStart(2,'0')+'<small>'+esc(human(w.date))+'</small></div>'+
      '<div><div class="wtitle">'+esc(w.title)+'</div>'+(w.tags?'<div class="tags">'+chips(w.tags)+'</div>':'')+'</div>'+
      '<div class="flags">'+flags+'<span class="caret" aria-hidden="true">&#8964;</span></div></summary>'+
      '<div class="week-body">'+body+'</div></details>';
  }
  function periodRow(p){
    var isNext = p.id===nextPeriod;
    return '<div class="period'+(isNext?' next':'')+'" id="donem-'+esc(p.id)+'"><div class="pl">'+esc(p.label)+'<br>'+esc(p.dates)+
      (isNext?'<br><span class="chip theory" style="margin-top:6px">Sıradaki</span>':'')+'</div>'+
      '<div><div class="pt">'+esc(p.title)+'</div><div class="px">'+md(p.text)+'</div></div></div>';
  }
  function plan(){
    var rows = '';
    D.weeks.forEach(function(w){ rows += weekRow(w); D.periods.filter(function(p){ return p.after===w.n; }).forEach(function(p){ rows += periodRow(p); }); });
    return '<section id="plan"><div class="section-head"><h2>14 haftalık plan</h2></div>'+
      '<p class="lede" style="margin-bottom:14px">'+md(D.planNote)+'</p>'+
      '<div class="toolbar"><div class="tags"><span class="chip">Konu</span><span class="chip lab">Lab</span><span class="chip ship">Proje teslimi</span></div>'+
      '<div class="spacer"></div><button class="btn" type="button" id="openAll">Tümünü aç</button><button class="btn" type="button" id="closeAll">Tümünü kapat</button></div>'+
      '<div class="timeline">'+rows+'</div></section>';
  }

  function project(){
    var P = D.project, cells = '';
    D.weeks.forEach(function(w){
      var m = P.milestones.filter(function(x){ return x.week===w.n; })[0];
      cells += '<div class="cell'+(m?' m':'')+(w.off?' off':'')+'" title="Hafta '+w.n+' · '+esc(human(w.date))+'">'+(m?esc(m.code):w.n)+'</div>';
      D.periods.filter(function(p){ return p.after===w.n && p.id==='vize'; }).forEach(function(){ cells += '<div class="cell exam" title="Vize haftası">VİZE</div>'; });
    });
    return '<section id="proje"><div class="section-head"><h2>Dönem projesi</h2><span class="muted">4 kişilik takımlar · 14 takım</span></div>'+
      '<p class="lede">'+md(P.team)+'</p><p class="lede">'+md(P.what)+'</p><p class="lede">'+md(P.ideas)+'</p>'+
      '<div class="track" role="img" aria-label="Kilometre taşları: M0 Hafta 4, M1 Hafta 10, M2 Hafta 12, M3 Hafta 14">'+cells+'</div>'+
      '<div class="mslist">'+P.milestones.map(function(m){ return '<div class="msrow"><div class="code">'+esc(m.code)+'<small>Hafta '+m.week+'</small></div><div><div class="when">'+esc(m.date)+'</div><div class="muted" style="font-size:.93rem">'+md(m.text)+'</div></div></div>'; }).join('')+'</div>'+
      '<div class="callout ship">'+md(P.freeze)+' '+md(P.individual)+'</div>'+
      '<h3 style="margin:22px 0 10px">Final teslimi şu başlıklarla değerlendirilir</h3>'+
      '<div class="tablewrap"><table><thead><tr><th>Başlık</th><th>Neye bakılır?</th></tr></thead><tbody>'+
      P.rubric.map(function(r){ return '<tr><td class="b">'+esc(r.dim)+'</td><td>'+md(r.desc)+'</td></tr>'; }).join('')+'</tbody></table></div></section>';
  }

  function grading(){
    var G = D.grading;
    var colors = {theory:'var(--theory)', lab:'var(--lab)', ship:'var(--ship)', ai:'var(--ai)', 'theory-dark':'color-mix(in srgb, var(--theory) 65%, #000)', 'ship-dark':'color-mix(in srgb, var(--ship) 70%, #000)'};
    var yil = G.items.filter(function(g){ return g.group==='yil'; }), son = G.items.filter(function(g){ return g.group==='son'; });
    var sum = function(a){ return a.reduce(function(t,g){ return t+g.points; },0); };
    var seg = function(g){ return '<div style="flex:'+g.points+';background:'+colors[g.color]+'" title="'+esc(g.name)+': '+g.points+' puan">'+g.points+'</div>'; };
    return '<section id="degerlendirme"><div class="section-head"><h2>Değerlendirme</h2><span class="muted">Toplam 100 puan</span></div>'+
      '<div class="bar" role="img" aria-label="Not dağılımı: yıl içi '+sum(yil)+', yarıyıl sonu '+sum(son)+'">'+yil.map(seg).join('')+'<div class="gap"></div>'+son.map(seg).join('')+'</div>'+
      '<div class="barlegend"><span>Yıl içi · '+sum(yil)+' puan</span><span>Yarıyıl sonu · '+sum(son)+' puan</span></div>'+
      '<div class="tablewrap" style="margin-top:14px"><table><thead><tr><th>Bileşen</th><th>Puan</th><th>Açıklama</th></tr></thead><tbody>'+
      G.items.map(function(g){ return '<tr><td class="b"><span aria-hidden="true" style="display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:'+colors[g.color]+'"></span>'+esc(g.name)+'</td><td class="n">'+g.points+'</td><td>'+md(g.desc)+'</td></tr>'; }).join('')+
      '</tbody></table></div>'+
      '<div class="facts"><div class="fact"><span class="k">Geçme</span>'+md(G.totals)+'</div><div class="fact"><span class="k">Devam</span>'+md(G.attendance)+'</div></div></section>';
  }

  function submit(){
    var S = D.submit;
    return '<section id="teslim"><div class="section-head"><h2>Lab teslimi</h2><span class="muted">Aynı Google Form, iki adım</span></div>'+
      '<p class="lede">'+md(S.intro)+'</p>'+
      '<div class="cards2" style="margin-top:14px">'+S.steps.map(function(s,i){ return '<div class="card"><div class="eyebrow">Adım '+(i+1)+' · '+esc(s.title)+'</div><div class="due">'+esc(s.due)+'</div><p>'+md(s.text)+'</p></div>'; }).join('')+'</div>'+
      '<div class="callout">'+md(S.example)+'</div>'+
      '<div class="card" style="margin-top:14px"><h3>Formda dolduracakların</h3><ul class="check">'+S.fields.map(function(f){ return '<li>'+md(f)+'</li>'; }).join('')+'</ul></div></section>';
  }

  function ai(){
    var A = D.ai;
    return '<section id="yapay-zeka"><div class="section-head"><h2>Yapay zekâ kuralları</h2><span class="muted">Yardımcı, merkez değil</span></div>'+
      A.paras.map(function(p){ return '<p class="lede">'+md(p)+'</p>'; }).join('')+
      '<div class="cards2" style="margin-top:14px">'+A.phases.map(function(ph){ return '<div class="card block '+(ph.kind==='ai'?'':'theory')+'" style="'+(ph.kind==='ai'?'border-top:3px solid var(--ai)':'')+'"><div class="when" style="'+(ph.kind==='ai'?'color:var(--ai)':'')+'">'+esc(ph.when)+'</div><h3>'+esc(ph.title)+'</h3><p>'+md(ph.text)+'</p></div>'; }).join('')+'</div>'+
      '<h3 style="margin:22px 0 10px">Sınavlarda yapay zekâ</h3>'+
      '<div class="tablewrap"><table><thead><tr><th>Sınav</th><th>Bölüm</th><th>Yapay zekâ</th></tr></thead><tbody>'+
      A.exams.map(function(e){ return '<tr><td class="b">'+esc(e.exam)+'</td><td>'+esc(e.part)+'</td><td>'+esc(e.ai)+'</td></tr>'; }).join('')+'</tbody></table></div>'+
      '<h3 style="margin:22px 0 4px">Haftalık yapay zekâ notu</h3><p>'+md(A.noteIntro)+'</p>'+
      '<div class="notebar"><button class="btn small" type="button" id="copyNote" aria-describedby="aiNote">Kopyala</button></div>'+
      '<pre class="note" id="aiNote">'+esc(A.noteTemplate)+'</pre>'+
      '<div class="copied" id="copyMsg" aria-live="polite"></div></section>';
  }

  function tools(){
    return '<section id="araclar"><div class="section-head"><h2>Araçlar</h2><span class="muted">Yalnız kullandıklarımız</span></div>'+
      '<p class="lede" style="margin-bottom:14px">'+md(D.toolsIntro)+'</p>'+
      '<div class="tablewrap"><table><thead><tr><th>Araç</th><th>Ne işe yarar?</th><th>İlk kullandığımız hafta</th></tr></thead><tbody>'+
      D.tools.map(function(t){ return '<tr><td class="b">'+esc(t.name)+'</td><td>'+md(t.role)+'</td><td>'+esc(t.week)+'</td></tr>'; }).join('')+'</tbody></table></div></section>';
  }

  // ---- sayfayı kur ----
  document.getElementById('jump').innerHTML = SECTIONS.map(function(s){ return '<a href="#'+s.id+'">'+esc(s.label)+'</a>'; }).join('');
  main.innerHTML = hero()+purpose()+rhythm()+plan()+project()+grading()+submit()+ai()+tools();
  document.getElementById('footer').textContent = D.footer;

  function openWeek(n, scroll){
    var el = document.getElementById('hafta-'+n); if(!el) return;
    el.open = true;
    if(scroll) el.scrollIntoView({block:'start'});
  }
  if(nextWeek) openWeek(nextWeek, false);

  document.addEventListener('click', function(e){
    var g = e.target.closest('[data-goto]');
    if(g){ openWeek(+g.getAttribute('data-goto'), true); history.replaceState(null,'','#hafta-'+g.getAttribute('data-goto')); return; }
    var gp = e.target.closest('[data-goto-period]');
    if(gp){ var el = document.getElementById('donem-'+gp.getAttribute('data-goto-period')); if(el) el.scrollIntoView({block:'start'}); return; }
    if(e.target.id==='openAll' || e.target.id==='closeAll'){
      var open = e.target.id==='openAll';
      document.querySelectorAll('details.week').forEach(function(d){ d.open = open; });
    }
  });

  // yapay zekâ notunu panoya kopyala
  var copyBtn = document.getElementById('copyNote'), copyMsg = document.getElementById('copyMsg');
  function fallbackCopy(text){
    var ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    var ok = false; try{ ok = document.execCommand('copy'); }catch(err){ ok = false; }
    document.body.removeChild(ta); return ok;
  }
  copyBtn.addEventListener('click', function(){
    var text = D.ai.noteTemplate;
    var done = function(ok){ copyMsg.textContent = ok ? 'Kopyalandı. Teslim formundaki yapay zekâ notu alanına yapıştır.' : 'Kopyalanamadı. Metni seçip elle kopyala.'; };
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }, function(){ done(fallbackCopy(text)); });
    } else { done(fallbackCopy(text)); }
  });

  // adres #hafta-N ise o haftayı aç
  function fromHash(){
    var m = /^#hafta-(\d+)$/.exec(location.hash);
    if(m) openWeek(+m[1], true);
  }
  window.addEventListener('hashchange', fromHash);
  fromHash();
  window.addEventListener('beforeprint', function(){ document.querySelectorAll('details.week').forEach(function(d){ d.open = true; }); });
})();
</script>
</body>
</html>
